[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polite-crawler"
version = "0.1.0"
description = "Identified Playwright collector for public HTML"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "playwright>=1.40.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
